name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble public site
        run: |
          mkdir -p _site
          cp docs/index.html docs/styles.css docs/init.js docs/CNAME docs/robots.txt docs/sitemap.xml docs/404.html docs/.nojekyll _site/
          cp public/favicon.svg public/favicon-32.png public/apple-touch-icon.png public/og.jpg _site/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
